version: '3.8'

services:
  # Laravel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cabanas-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - mysql
    environment:
      APP_NAME: "Cabañas Playa Terco"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: cabanas_terco
      DB_USERNAME: cabanas_user
      DB_PASSWORD: secret
      QUEUE_CONNECTION: sync
      CACHE_STORE: database
      SESSION_DRIVER: database
      FILESYSTEM_DISK: public
      UPLOADS_DISK: public
      AWS_ACCESS_KEY_ID: ${DO_SPACES_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${DO_SPACES_SECRET:-}
      AWS_DEFAULT_REGION: ${DO_SPACES_REGION:-nyc3}
      AWS_BUCKET: ${DO_SPACES_BUCKET:-cabanas-playa-terco}
      AWS_URL: ${DO_SPACES_URL:-https://cabanas-playa-terco.nyc3.digitaloceanspaces.com}
      AWS_ENDPOINT: ${DO_SPACES_ENDPOINT:-https://nyc3.digitaloceanspaces.com}
      AWS_USE_PATH_STYLE_ENDPOINT: "false"
      FRONTEND_URL: http://localhost:3000
      SANCTUM_STATEFUL_DOMAINS: "localhost:3000,localhost"
      SESSION_DOMAIN: "null"
    networks:
      - cabanas-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cabanas-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_WHATSAPP_NUMBER: "+573147427806"
      NEXT_PUBLIC_PHONE_NUMBER: "+573147427806"
    depends_on:
      - backend
    networks:
      - cabanas-network

  # MySQL 8
  mysql:
    image: mysql:8.0
    container_name: cabanas-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: cabanas_terco
      MYSQL_USER: cabanas_user
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - cabanas-network

  # Mailhog (Email testing local)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: cabanas-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - cabanas-network

volumes:
  mysql_data:
    driver: local

networks:
  cabanas-network:
    driver: bridge
